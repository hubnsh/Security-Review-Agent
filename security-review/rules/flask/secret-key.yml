# rules/flask/secret-key.yml
id: flask-secret-key-hardcoded
name: Hardcoded Flask Secret Key
description: >
  Flask's SECRET_KEY is hardcoded in the source code. This key is
  used for signing session cookies and other security tokens.
  A leaked key allows attackers to forge session cookies.
severity: critical
cwe: CWE-798
owasp: "A02:2021"
languages: [python]
frameworks: [flask]
tags: [secret-key, flask, hardcoded]

detect:
  - type: regex_in_file
    pattern: "app\\.secret_key\\s*=\\s*['\"][^'\"]+['\"]"
    exclude_extensions: [.md, .txt]
    exclude_paths:
      - "**/venv/**"
      - "**/.env/**"
  - type: regex_in_file
    pattern: "SECRET_KEY\\s*=\\s*['\"][^'\"]{8,}['\"]"
    exclude_extensions: [.md, .txt]
    exclude_paths:
      - "**/venv/**"
      - "**/.env/**"

fix:
  - type: replace_with_env_var
    description: "Move SECRET_KEY to environment variable"
    effort: low
