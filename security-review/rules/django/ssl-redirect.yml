# rules/django/ssl-redirect.yml
id: django-ssl-redirect-missing
name: HTTPS Redirection Not Enforced
description: >
  SECURE_SSL_REDIRECT is not configured. HTTP requests are not redirected
  to HTTPS, allowing traffic and session cookies to be intercepted in
  transit.
severity: high
cwe: CWE-319
owasp: "A02:2021"
languages: [python]
frameworks: [django]
tags: [https, ssl, django, redirect]

detect:
  - type: file_contains
    path: "**/settings.py"
    pattern: "MIDDLEWARE"
  - type: file_not_contains
    path: "**/settings.py"
    pattern: "SECURE_SSL_REDIRECT"
  - type: file_not_contains
    path: "**/settings.py"
    pattern: "SECURE_PROXY_SSL_HEADER"

fix:
  - type: insert
    description: "Add HTTPS redirect settings to settings.py"
    effort: low
    text: |
      SECURE_SSL_REDIRECT = True
      SECURE_PROXY_SSL_HEADER = ('HTTP_X_FORWARDED_PROTO', 'https')
      SESSION_COOKIE_SECURE = True
      CSRF_COOKIE_SECURE = True
