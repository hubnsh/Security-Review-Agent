# rules/django/secret-key.yml
id: django-secret-key-hardcoded
name: SECRET_KEY Hardcoded in Settings
description: >
  The Django SECRET_KEY is hardcoded directly in settings.py. This key is
  used for cryptographic signing (sessions, CSRF tokens, password reset
  tokens). If exposed in version control, an attacker can forge signed data.
severity: critical
cwe: CWE-798
owasp: "A02:2021"
languages: [python]
frameworks: [django]
tags: [secrets, django, key]

detect:
  - type: regex_in_file
    path: "**/settings.py"
    pattern: "SECRET_KEY\\s*=\\s*['\"][^'\"]+['\"]"

fix:
  - type: edit
    description: "Replace hardcoded key with environment variable reference"
    file: "**/settings.py"
    effort: low
  - type: config
    description: "Generate a new key and add to .env"
    effort: low

# 检测逻辑说明：
# 此规则找到 SECRET_KEY 的硬编码值后，生成修复：
# 1. 原行: SECRET_KEY = 'django-insecure-...'
# 2. 修改为: SECRET_KEY = os.getenv('DJANGO_SECRET_KEY', 'fallback-dev-only-key')
# 注意：硬编码的 fallback 值仅用于开发环境
