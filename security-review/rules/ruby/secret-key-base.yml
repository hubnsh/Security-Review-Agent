# rules/ruby/secret-key-base.yml
id: rails-secret-key-base-hardcoded
name: Rails secret_key_base Hardcoded
description: >
  Rails secret_key_base is hardcoded in the source code. This key is used
  for signing cookies and other security tokens. A leaked key allows
  attackers to forge signed cookies and gain authenticated access.
severity: critical
cwe: CWE-798
owasp: "A02:2021"
languages: [ruby]
frameworks: [rails]
tags: [secret-key-base, rails, hardcoded]

detect:
  - type: regex_in_file
    path: "**/secrets.yml"
    pattern: "secret_key_base:\\s*['\"][^'\"]{16,}['\"]"
    exclude_paths:
      - "**/test/**"
  - type: regex_in_file
    path: "**/credentials.yml.enc"
    pattern: "secret_key_base"
  - type: regex_in_file
    path: "**/*.rb"
    pattern: "secret_key_base\\s*=\\s*['\"][^'\"]{16,}['\"]"
    exclude_paths:
      - "**/test/**"
      - "**/config/environments/**"

fix:
  - type: replace_with_env_var
    description: "Move secret_key_base to Rails.env secret or environment variable"
    effort: low
  - type: edit
    description: "Use Rails.credentials.secret_key_base or ENV['SECRET_KEY_BASE']"
    effort: low
