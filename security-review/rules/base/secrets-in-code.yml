# rules/base/secrets-in-code.yml
id: hardcoded-secret-key
name: Hardcoded Secret/Key in Source Code
description: >
  Detects hardcoded secrets, API keys, passwords, tokens, and other
  credentials in source code. Credentials should be stored in environment
  variables or a secure vault, never committed to the repository.
severity: critical
cwe: CWE-798
owasp: "A02:2021"
languages: [python, javascript, go, java, ruby, php, rust, csharp]
tags: [secrets, credentials, hardcoded]

detect:
  - type: regex_in_file
    pattern: '(SECRET_[A-Z_]+\s*[=:]\s*["''][^"'']+["''])'
    exclude_extensions: [.env, .env.example, .md, .txt, .yaml, .yml, .json, .xml]
    exclude_paths:
      - "**/node_modules/**"
      - "**/venv/**"
      - "**/.git/**"
      - "**/__pycache__/**"
      - "**/dist/**"
      - "**/build/**"
  - type: regex_in_file
    pattern: '(API[_-]?KEY\s*[=:]\s*["''][^"'']+["''])'
    exclude_extensions: [.md, .txt, .yaml, .yml]
    exclude_paths:
      - "**/node_modules/**"
      - "**/venv/**"
      - "**/.git/**"
  - type: regex_in_file
    pattern: '(password\s*[=:]\s*["''][^"'']{8,}["''])'
    exclude_extensions: [.md, .txt]
    exclude_paths:
      - "**/node_modules/**"
      - "**/venv/**"
      - "**/.git/**"
      - "**/test*/**"
      - "**/spec/**"

fix:
  - type: replace_with_env_var
    description: "Move the secret to an environment variable and reference via os.getenv() / process.env"
    effort: low
  - type: add_to_gitignore
    content: ".env\n.env.local\n"
    description: "Add .env files to .gitignore to prevent future leaks"
    effort: low
