# rules/terraform/plaintext-secrets.yml
id: terraform-plaintext-secrets
name: Secrets Stored in Plaintext
description: >
  Terraform configuration stores sensitive values (passwords, access keys,
  database credentials) in plaintext. Secrets should be sourced from
  variables, environment, or a secrets manager.
severity: critical
cwe: CWE-798
owasp: "A02:2021"
languages: []
frameworks: []
tags: [terraform, secrets, iac]

detect:
  - type: regex_in_file
    path: "**/*.tf"
    pattern: "(password|secret|access_key|secret_key)\\s*=\\s*\"[^\"]{8,}\""
    exclude_paths:
      - "**/test/**"
      - "**/examples/**"

fix:
  - type: replace_with_env_var
    description: "Move secrets to Terraform variables with sensitive=true"
    effort: low
  - type: edit
    description: "Use a secrets manager (AWS Secrets Manager, Vault)"
    effort: medium
