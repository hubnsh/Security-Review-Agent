# rules/k8s/secret-not-encrypted.yml
id: k8s-secret-not-base64-encrypted
name: K8s Secret Values Not Properly Encrypted
description: >
  Kubernetes Secret values should be base64-encoded, but this is not
  encryption. For production, secrets should be encrypted at rest using
  KMS or managed with external secret management tools (External Secrets,
  Sealed Secrets, Vault).
severity: medium
cwe: CWE-200
owasp: "A02:2021"
languages: []
tags: [k8s, secret, encryption, vault]

detect:
  - type: file_contains
    path: "**/*.k8s.{yml,yaml}"
    pattern: "kind: Secret"
  - type: file_not_contains
    path: "**/*.k8s.{yml,yaml}"
    pattern: "encrypted:"

fix:
  - type: config
    description: "Use Sealed Secrets or External Secrets Operator for production secrets"
    effort: high
  - type: config
    description: "Enable encryption at rest for etcd: --encryption-provider-config"
    effort: high
