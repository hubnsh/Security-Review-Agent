# rules/cicd/secrets-in-ci.yml
id: cicd-secrets-exposed
name: Secrets Exposed in CI/CD Configuration
description: >
  Detects hardcoded secrets, tokens, or credentials in CI/CD configuration
  files. CI/CD pipelines should use encrypted secrets provided by the CI
  platform (GitHub Secrets, GitLab CI Variables, etc.) instead of
  hardcoding values.
severity: high
cwe: CWE-798
owasp: "A05:2021"
languages: []
tags: [cicd, secrets, github-actions, gitlab]

detect:
  - type: regex_in_file
    pattern: '(password|token|secret|api_key|api-key)\s*[:=]\s*["''][^"'']+["'']'
    path: "**/.github/workflows/*.{yml,yaml}"
    exclude_extensions: []
  - type: regex_in_file
    pattern: '(password|token|secret|api_key|api-key)\s*[:=]\s*["''][^"'']+["'']'
    path: "**/*.gitlab-ci.{yml,yaml}"
  - type: regex_in_file
    pattern: 'with:\s*\n\s+password:\s*["'']\$'
    path: "**/.github/workflows/*.{yml,yaml}"
  - type: line_matches
    path: "**/.github/workflows/*.{yml,yaml}"
    pattern: 'echo\s+.*\${{.*secrets\.'

fix:
  - type: edit
    description: "Replace hardcoded value with GitHub Secrets: ${{ secrets.MY_SECRET }}"
    effort: low
  - type: edit
    description: "Replace hardcoded value with GitLab CI Variables: $MY_SECRET"
    effort: low
  - type: config
    description: "Add secrets to CI/CD platform settings (not in repository)"
    effort: low
